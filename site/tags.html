---
layout: page
title: Filter by Tag
permalink: /tags/
---

<h2 id="active-tag-heading">All Posts</h2>
<button onclick="filterPosts('')">Show All</button>

<ul id="post-list">
  {% for post in site.posts %}
    <li class="post-item" data-tags="{{ post.tags | join: ',' | downcase }}">
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
  {% endfor %}
</ul>

<script>
  function filterPosts(selectedTag) {
    const tag = selectedTag.toLowerCase();
    const heading = document.getElementById('active-tag-heading');
    const posts = document.querySelectorAll('.post-item');

    heading.textContent = tag ? `Posts tagged: "${selectedTag}"` : 'All Posts';

    posts.forEach(post => {
      const postTags = post.getAttribute('data-tags').split(',');
      if (!tag || postTags.includes(tag)) {
        post.style.display = 'list-item';
      } else {
        post.style.display = 'none';
      }
    });
  }

  // Read ?tag= from URL on page load
  const urlParams = new URLSearchParams(window.location.search);
  const initialTag = urlParams.get('tag');
  if (initialTag) {
    filterPosts(initialTag);
  }
</script>
