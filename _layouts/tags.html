---
layout: default
---

<style>
  .tag-hidden { display: none !important; }
</style>

<div class="mb-4" id="filter-controls" style="display: none;">
  <button class="btn btn-sm btn-outline-secondary" onclick="filterByTag('')">
    &larr; Show All Tags
  </button>
  <span id="no-results-msg" class="ml-3 text-muted" style="display: none;"></span>
</div>

<div id="tags-list">
{% for tag in site.tags %}
  <div class="tag-group" data-tag="{{ tag[0] }}">
    <div class="row listrecent">
      <div class="section-title col-md-12 mt-4">
        <h2 id="{{ tag[0] | replace: ' ', '-' }}">Tag <span class="text-capitalize">{{ tag[0] }}</span></h2>
      </div>
      {% for post in tag[1] %}
        {% if post.title != null %}
          {% include postbox.html %}
        {% endif %}
      {% endfor %}
    </div>
  </div>
{% endfor %}
</div>

<script>
  function normalize(s) {
    var v = s || '';
    try { v = decodeURIComponent(v); } catch (e) {}
    return v.replace(/[-,]/g, ' ').replace(/\s+/g, ' ').toLowerCase().trim();
  }

  function filterByTag(selectedTag) {
    var cleanTag = normalize(selectedTag);
    var groups = document.querySelectorAll('#tags-list .tag-group');
    var matchCount = 0;

    groups.forEach(function (g) {
      var match = !cleanTag || normalize(g.getAttribute('data-tag')) === cleanTag;
      g.classList.toggle('tag-hidden', !match);
      if (match) matchCount++;
    });

    document.getElementById('filter-controls').style.display = cleanTag ? 'block' : 'none';

    var msg = document.getElementById('no-results-msg');
    if (cleanTag && matchCount === 0) {
      msg.textContent = 'No posts found with tag "' + selectedTag + '".';
      msg.style.display = 'inline';
    } else {
      msg.style.display = 'none';
    }

    if (!cleanTag && (window.location.search || window.location.hash)) {
      window.history.replaceState({}, '', window.location.pathname);
    }
  }

  function applyFromUrl() {
    var params = new URLSearchParams(window.location.search);
    var tag = params.get('tag') || window.location.hash.replace(/^#/, '');
    filterByTag(tag);
  }

  document.addEventListener('DOMContentLoaded', applyFromUrl);
  window.addEventListener('hashchange', applyFromUrl);
</script>
